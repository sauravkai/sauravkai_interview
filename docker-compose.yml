version: '3.9'

services:
  # ─────────────────────────────────────────────────
  # MongoDB Database
  # ─────────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: ai_interview_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ai-interview-platform
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_network

  # ─────────────────────────────────────────────────
  # Express API Server
  # ─────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_interview_server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ai-interview-platform
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
      ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-false}
      SERVE_STATIC: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VAPI_API_KEY: ${VAPI_API_KEY:-}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-}
    ports:
      - "5000:5000"
    volumes:
      # Mount docker socket to enable Docker-in-Docker code execution
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app_network

  # ─────────────────────────────────────────────────
  # React Frontend (Nginx)
  # ─────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SOCKET_URL: ""
    container_name: ai_interview_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3001:80"
    networks:
      - app_network

volumes:
  mongo_data:
    driver: local

networks:
  app_network:
    driver: bridge
